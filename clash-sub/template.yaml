# 完整 Clash 配置模板
#
# 生成时会把节点列表注入到下方「proxies:」段，并把节点名注入各 proxy-group。
# 规则用 mihomo 内置 GEOSITE / GEOIP，不需要额外的 rule-providers 下载。

# ---------- 基础 ----------
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-interval: 30
disable-keep-alive: false

profile:
  store-selected: true
  store-fake-ip: true

# ---------- TUN（可选，客户端可自行开关）----------
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

# ---------- DNS ----------
# 关键点：
#   - 国内域名用国内 DoH，国外域名用代理侧 DoH，避免污染和泄漏
#   - fake-ip 模式，配合 GEOSITE 规则效率最高
#   - proxy-server-nameserver 单独指定，避免节点域名解析走自身形成死循环
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.srv.nintendo.net"
    - "+.xboxlive.com"
    - "+.battlenet.com.cn"
    - "dns.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
      - https://dns.google/dns-query

# ---------- sniffer ----------
# 配合 fake-ip 使用：把 TLS SNI / HTTP Host 还原成真实域名再走规则
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"

# ---------- GEO 数据 ----------
geodata-mode: true
geo-auto-update: true
geo-update-interval: 168
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# ---------- 节点 ----------
proxies:
{{PROXIES}}

# ---------- 代理组 ----------
# 手动选择 / 自动选择（延迟最低）/ 故障转移
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "DIRECT"
{{PROXY_NAMES}}

  - name: "♻️ 自动选择"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
{{PROXY_NAMES}}

  - name: "🔯 故障转移"
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
    proxies:
{{PROXY_NAMES}}

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"

# ---------- 规则 ----------
# 顺序即优先级：先精确后宽泛，最后 MATCH 兜底
rules:
  # 局域网 / 私有地址直连
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOSITE,private,DIRECT

  # 广告
  - GEOSITE,category-ads-all,🛑 广告拦截

  # 常见国内服务直连（避免绕路）
  - GEOSITE,cn,🎯 全球直连
  - GEOIP,CN,🎯 全球直连,no-resolve

  # 国外走代理
  - GEOSITE,geolocation-!cn,🚀 节点选择

  # 兜底
  - MATCH,🐟 漏网之鱼
