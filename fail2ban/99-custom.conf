# fail2ban 配置（宿主机原生安装，不使用容器）
#
# 部署：
#   apt install -y fail2ban
#   cp fail2ban/99-custom.conf /etc/fail2ban/jail.d/
#   systemctl enable --now fail2ban
#
# 为什么不用容器：fail2ban 本质上是在操作宿主机的 nftables、读宿主机的日志。
# 容器化需要 NET_ADMIN + host 网络 + 挂载 /var/log，等于把边界全打开，
# 却没有任何隔离收益；反而多一层调试成本，并可能和宿主机已有实例
# 争抢同一个 f2b-table 导致规则互相覆盖。

[DEFAULT]
# 先确认后端：ls /var/log/auth.log
#   - 文件存在 -> 用 backend = file（下面的 logpath 有效）
#   - 不存在   -> 改成 backend = systemd，并删掉 [sshd] 里的 logpath
# Ubuntu 24.04 云镜像部分镜像默认只有 journal，没有 auth.log。
backend = file

# 封禁走 nftables，与现代 Debian/Ubuntu 默认防火墙后端一致
banaction = nftables
banaction_allports = nftables[type=allports]

# 累犯递增：10m -> 20m -> 40m ...，上限 1 天
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1d
bantime = 10m
findtime = 10m
maxretry = 5

# 白名单。家宽 IP 会变，换了要更新，否则可能把自己封在外面。
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true
logpath = /var/log/auth.log
# 必须写实际 SSH 端口。写成默认 22 会让规则挂到错误端口上，等于没有防护。
port = 21080
# aggressive 额外识别公钥枚举、用户名探测
mode = aggressive
maxretry = 3
findtime = 10m
bantime = 10m

# 显式禁用 3x-ui 自带的 IP 限制 jail。
# 它的 ban 动作执行的是：
#   iptables -I f2b-3x-ipl -s <ip> -p tcp -m multiport ! --dports 21080,11297 -j REJECT
# 即封禁除 21080、11297 之外的所有端口，会连带封掉 443 节点和 8080 订阅。
# 其触发条件（客户端并发 IP 超限）在 limitIp=0 时永远不成立，
# 留着只有风险没有收益。
[3x-ipl]
enabled = false
