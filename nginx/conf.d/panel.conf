# 面板 + 订阅反向代理
#
# 前置条件：
#   1. panel.<domain> / sub.<domain> 的 A 记录已指向本机公网 IP
#   2. 证书在 ./nginx/cert/{fullchain.pem,privkey.pem}
#   3. x-ui 已设 webListen=127.0.0.1、webPort=11297
#
# 端口分工：443 给 Reality（x-ui/Xray 独占），8080 给 nginx。
# 不要让 nginx 在 443 上按 SNI 分流——Reality 对 TLS 指纹敏感，配错即节点不可用。

limit_req_zone $binary_remote_addr zone=panel_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sub_fetch:10m rate=30r/m;
limit_req_status 429;

upstream xui_panel {
    server 127.0.0.1:11297;
    keepalive 16;
}

server {
    listen 8080 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 管理入口不该被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 只对登录接口限流。面板带随机 webBasePath，用可选前缀匹配避免写死路径。
    # 绝对不能把 limit_req 放到 location /：面板是 SPA，首页会并发几十个
    # API 请求，全局限流会把正常使用卡死。
    location ~ ^/(?:[A-Za-z0-9_-]+/)?login$ {
        limit_req zone=panel_login burst=3 nodelay;
        proxy_pass https://xui_panel;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass https://xui_panel;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 面板的实时流量图走 WebSocket，不转发升级头会空白
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 8080 ssl;
    http2 on;
    server_name sub.example.com;

    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # x-ui 订阅端口（SUB_PORT，默认 80）。host 网络下即 127.0.0.1:80。
    # 订阅服务只接受 HTTPS，所以这里也必须是 https://
    location / {
        limit_req zone=sub_fetch burst=10 nodelay;
        proxy_pass https://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
